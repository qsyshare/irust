[package]
name = "irust"
version = "0.1.0"
edition = "2024"


[dependencies]
poem = "1.0"
warp = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
rand = "0.8"     # 用于生成随机数
aes = "0.7"
block-modes = "0.8"
block-padding = "0.2"
hex = "0.4"
sha2 = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
chrono = "0.4"































